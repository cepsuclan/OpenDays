<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob's Random Phrases</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --dim-green: #003b00;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* CRT Overlay Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        h1 {
            letter-spacing: 8px;
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--neon-green);
        }

        #status-terminal {
            width: 100%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-green);
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            height: 80px;
            overflow-y: hidden;
            box-shadow: 0 0 20px var(--dim-green);
        }

        #bingo-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 500px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 1px solid var(--neon-green);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 1.5rem;
            background: rgba(0, 20, 0, 0.6);
            font-weight: bold;
        }

        .cell:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .cell.marked {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 30px var(--neon-green);
            transform: scale(0.95);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--neon-green); }
            to { box-shadow: 0 0 30px var(--neon-green); }
        }

        button {
            margin-top: 30px;
            background: black;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px 25px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--neon-green);
            color: black;
        }
    </style>
</head>
<body>

    <h1>[Random Phrases]</h1>
    
    <div id="status-terminal">
        > SYSTEM_INIT...<br>
        > LOADING_RANDOM_SEED...<br>
        > READY.
    </div>
    
    <div id="bingo-board"></div>

    <button onclick="window.location.reload()">RE-GENERATE_GRID</button>

    <script>
        // Expanded phrase list for more randomness
        const phrasePool = [
            "Circle back", "Raitional", "Low hanging fruit", "Deep dive",
            "Touch base", "Bandwidth", "Moving parts", "At the end of the day",
            "Pain point", "Best practices", "Game changer", "Leverage",
            "Value add", "Think outside the box", "Staff Costs", "Win-win"
        ];

        const boardSize = 4;
        let gameOver = false;

        function logTerminal(msg) {
            const term = document.getElementById('status-terminal');
            // Keep only last 3 lines
            const lines = term.innerHTML.split('<br>').slice(-3);
            lines.push(`> ${msg}`);
            term.innerHTML = lines.join('<br>');
        }

        function createBoard() {
            const board = document.getElementById('bingo-board');
            board.innerHTML = '';
            
            // Randomize: Select 16 random phrases from the pool and shuffle them
            const selected = phrasePool
                .sort(() => 0.5 - Math.random()) // Shuffle pool
                .slice(0, 16); // Take first 16

            selected.forEach((phrase, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = phrase;
                cell.onclick = () => markCell(cell, phrase);
                board.appendChild(cell);
            });
        }

        function markCell(cell, phrase) {
            if (gameOver || cell.classList.contains('marked')) return;

            cell.classList.add('marked');
            logTerminal(`BREACHED: ${phrase}`);
            checkWin();
        }

        function checkWin() {
            const cells = Array.from(document.querySelectorAll('.cell'));
            
            // Rows
            for (let i = 0; i < boardSize; i++) {
                const row = cells.slice(i * boardSize, i * boardSize + boardSize);
                if (row.every(c => c.classList.contains('marked'))) return triggerWin("ROW_BREACH");
            }

            // Columns
            for (let i = 0; i < boardSize; i++) {
                const col = [cells[i], cells[i+4], cells[i+8], cells[i+12]];
                if (col.every(c => c.classList.contains('marked'))) return triggerWin("COL_BREACH");
            }
        }

        function triggerWin(type) {
            gameOver = true;
            logTerminal(`CRITICAL: ${type} SUCCESS`);
            logTerminal("ACCESS GRANTED. SYSTEM LOCKED.");
            document.body.style.backgroundColor = "#001a00";
        }

        // Run on load
        createBoard();
    </script>
</body>
</html>
